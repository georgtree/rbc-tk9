name: Build packages
on: workflow_dispatch
permissions:
  contents: read
# Serialize manual builds so an older run cannot publish after a newer one.
concurrency:
  group: rbc-rolling-latest
  cancel-in-progress: false
jobs:
  build:
    name: ${{ matrix.toolchain }} / Tcl-Tk 9.1.0 / ${{ matrix.renderer }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        toolchain: [linux-gcc, windows-ucrt64, windows-msvc]
        renderer: [static-cairo, native]
        include:
          - os: ubuntu-24.04
            toolchain: linux-gcc
          - os: windows-2022
            toolchain: windows-ucrt64
          - os: windows-2022
            toolchain: windows-msvc
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/build-rbc
        with:
          toolchain: ${{ matrix.toolchain }}
          renderer: ${{ matrix.renderer }}
          make-dist: 'true'
      - uses: actions/upload-artifact@v4
        with:
          name: rbc-${{ matrix.toolchain }}-tcl9.1.0-${{ matrix.renderer }}
          path: _ci/package/
          if-no-files-found: error
  release:
    name: Publish latest
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - uses: actions/download-artifact@v4
        with:
          pattern: rbc-*-tcl9.1.0-*
          path: _ci/release
          merge-multiple: true
      - name: Update rolling release
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 .github/scripts/publish-release.py _ci/release
