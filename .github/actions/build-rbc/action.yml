name: Build and test RBC
description: Tcl/Tk 9.1.0, argparse, and source-built static Cairo/Pixman
inputs:
  toolchain:
    description: linux-gcc, windows-ucrt64, or windows-msvc
    required: true
  make-dist:
    description: Create an installation archive after tests pass
    default: 'false'
runs:
  using: composite
  steps:
    - uses: actions/checkout@v4
      with:
        repository: tcltk/tcl
        ref: core-9-1-0
        path: _ci/tcl
    - uses: actions/checkout@v4
      with:
        repository: tcltk/tk
        ref: core-9-1-0
        path: _ci/tk
    - uses: actions/checkout@v4
      with:
        repository: georgtree/argparse
        ref: ba27643af9f6878a86164bdb7123b60d38a403c7
        path: _ci/argparse
    - uses: actions/checkout@v4
      with:
        repository: tcltk/tcllib
        ref: tcllib-2-0
        path: _ci/tcllib
    - if: inputs.toolchain == 'linux-gcc'
      shell: bash
      run: |
        sudo apt-get update
        sudo apt-get install -y build-essential pkg-config zip xvfb xauth \
          libx11-dev libxext-dev libxrender-dev libxft-dev libfontconfig1-dev \
          libfreetype-dev libxss-dev libxrandr-dev libxcursor-dev libxi-dev \
          libfribidi-dev libharfbuzz-dev fonts-dejavu-core fonts-liberation
    - if: inputs.toolchain != 'windows-ucrt64'
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'
    - if: inputs.toolchain != 'windows-ucrt64'
      shell: bash
      run: python -m pip install meson==1.7.2 ninja==1.11.1.3
    - if: inputs.toolchain == 'windows-ucrt64'
      uses: msys2/setup-msys2@v2
      with:
        msystem: UCRT64
        update: true
        install: >-
          make zip tar git
          mingw-w64-ucrt-x86_64-gcc
          mingw-w64-ucrt-x86_64-libiconv
          mingw-w64-ucrt-x86_64-winpthreads
          mingw-w64-ucrt-x86_64-python
          mingw-w64-ucrt-x86_64-meson
          mingw-w64-ucrt-x86_64-ninja
          mingw-w64-ucrt-x86_64-pkgconf
    - if: inputs.toolchain == 'windows-msvc'
      uses: ilammy/msvc-dev-cmd@v1
      with:
        arch: x64
    - if: inputs.toolchain == 'linux-gcc'
      shell: bash
      env:
        MAKE_DIST: ${{ inputs.make-dist }}
      run: bash .github/scripts/build-tea.sh
    - if: inputs.toolchain == 'windows-ucrt64'
      shell: msys2 {0}
      env:
        MAKE_DIST: ${{ inputs.make-dist }}
      run: bash .github/scripts/build-tea.sh
    - if: inputs.toolchain == 'windows-msvc'
      shell: pwsh
      env:
        MAKE_DIST: ${{ inputs.make-dist }}
      run: ./.github/scripts/build-msvc.ps1
